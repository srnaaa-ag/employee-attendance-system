spring.application.name=backend

server.port=${PORT:8080}

# ======================
# DATABASE (Render)
# ======================
# Fallbacks allow local dev with PostgreSQL on localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/backend?sslmode=disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================
# JPA / HIBERNATE
# ======================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ======================
# CORS
# ======================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://employee-attendance-system-indol.vercel.app,http://localhost:5173,http://localhost:5174}

# ======================
# JWT
# ======================
# ?? Fallback must be 32+ characters for HS256 algorithm
jwt.secret=${JWT_SECRET:dev-fallback-secret-key-must-be-32-chars-min!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ======================
# PROFILE
# ======================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ======================
# MAIL
# ======================
app.mail.from=${APP_MAIL_FROM:noreply@attendance.local}

# ======================
# 2FA
# ======================
app.2fa.enabled=${APP_2FA_ENABLED:true}
app.2fa.delivery=${APP_2FA_DELIVERY:twilio}

# ======================
# TWILIO
# ======================
# Empty fallbacks allow app to start; Twilio features disabled until real creds provided
twilio.api-key-sid=${TWILIO_API_KEY_SID:}
twilio.api-key-secret=${TWILIO_API_KEY_SECRET:}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}